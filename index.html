<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КиноСфера</title>
    <meta name="description" content="КиноСфера - каталог фильмов и информация об актерах.">
    <meta name="keywords" content="фильмы, актеры, кино, поиск фильмов">
    <meta name="author" content="КиноСфера">
    <meta property="og:title" content="КиноСфера">
    <meta property="og:description" content="Поиск фильмов и детальная информация.">
    <meta property="og:type" content="website">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <div class="header__nav">
                <a href="#" class="logo" onclick="loadMovies('TOP_100_POPULAR_FILMS')">КИН<span>О</span>СФЕРА</a>
                <div class="header__search">
                    <input type="text" class="search-input" placeholder="Поиск фильмов...">
                </div>
                <div class="header__menu">
                    <button class="menu-btn" onclick="loadMovies('TOP_100_POPULAR_FILMS')">Популярное</button>
                    <button class="menu-btn" onclick="loadMovies('TOP_250_BEST_FILMS')">Топ 250</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="movies">
            <div class="container">
                <h2 class="section-title" id="page-title">Популярное сейчас</h2>
                <div class="movies__grid" id="movies-container"></div>
                <div class="load-more-container" style="text-align: center; margin-top: 40px;">
                    <button id="load-more" class="btn btn-outline" style="display: none;">Показать еще</button>
                </div>
            </div>
        </section>
    </main>

    <div id="modal" class="modal">
        <div class="modal__content">
            <span class="modal__close">&times;</span>
            <div id="modal-details"></div>
            <div id="modal-actors" class="modal__actors">
                <h3 class="actors-title">В ролях:</h3>
                <div class="actors-grid" id="actors-list"></div>
            </div>
            <div id="actor-info" class="actor-info" style="display: none;">
                <button class="back-to-movie btn-outline">← Назад</button>
                <div id="actor-details-content"></div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
